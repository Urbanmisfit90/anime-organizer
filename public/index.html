<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Organizer Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #ffffff; padding: 40px; max-width: 800px; margin: auto; }
        h1 { color: #bb86fc; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .controls { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        select { padding: 12px; font-size: 16px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; flex-grow: 1; cursor: pointer; min-width: 200px; }
        select:disabled { background: #222; color: #666; cursor: not-allowed; }
        button { padding: 12px 24px; font-size: 16px; background: #03dac6; color: #000; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #00b3a6; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        #console-output { background: #000000; color: #00ff00; padding: 20px; margin-top: 25px; height: 400px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; border-radius: 6px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h1>🎬 Anime Organizer</h1>
    <p>Select a show and an optional season folder to organize.</p>
    
    <div class="controls">
        <select id="main-folder-select" onchange="updateSubfolders()">
            <option value="">Loading library...</option>
        </select>
        
        <select id="sub-folder-select" disabled>
            <option value="">(No subfolders)</option>
        </select>

        <button id="run-btn" onclick="startProcess()">Run Renamer</button>
    </div>

    <div id="console-output">Ready...</div>

    <script>
        let libraryData = {}; // Stores our dictionary of folders

        // When the page loads, fetch the structured list from the server
        window.onload = async function() {
            try {
                const response = await fetch('/api/folders');
                libraryData = await response.json();
                const mainSelect = document.getElementById('main-folder-select');
                const shows = Object.keys(libraryData);
                
                if (shows.length === 0) {
                    mainSelect.innerHTML = '<option value="">No folders found in D:/Anime</option>';
                    return;
                }

                mainSelect.innerHTML = '<option value="">-- Select a Show --</option>';
                shows.forEach(show => {
                    const option = document.createElement('option');
                    option.value = show;
                    option.textContent = show;
                    mainSelect.appendChild(option);
                });
            } catch (error) {
                document.getElementById('console-output').innerHTML = "❌ Failed to load library folders.";
            }
        };

        // Triggered every time you change the first dropdown
        function updateSubfolders() {
            const mainSelect = document.getElementById('main-folder-select');
            const subSelect = document.getElementById('sub-folder-select');
            const selectedShow = mainSelect.value;

            subSelect.innerHTML = ''; // Clear out the old seasons

            // If no show is selected, or the show has no folders inside it
            if (!selectedShow || libraryData[selectedShow].length === 0) {
                subSelect.innerHTML = '<option value="">(No subfolders)</option>';
                subSelect.disabled = true;
                return;
            }

            // Populate the second dropdown with the specific subfolders
            subSelect.disabled = false;
            subSelect.innerHTML = '<option value="">-- Main Folder --</option>'; // Allows targeting the root if needed
            libraryData[selectedShow].forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                subSelect.appendChild(option);
            });
        }

        function startProcess() {
            const mainSelect = document.getElementById('main-folder-select');
            const subSelect = document.getElementById('sub-folder-select');
            const outputDiv = document.getElementById('console-output');
            const runBtn = document.getElementById('run-btn');

            const show = mainSelect.value;
            const sub = subSelect.value;

            if (!show) {
                alert("Please select a show first!");
                return;
            }

            // Combine them into a file path: "One Piece" OR "One Piece/Movies"
            const targetFolder = sub ? `${show}/${sub}` : show;

            // Lock the button
            runBtn.disabled = true;
            outputDiv.innerHTML = `Initializing script for: ${targetFolder}...\n=============================================\n`;

            const eventSource = new EventSource('/api/run-script?folder=' + encodeURIComponent(targetFolder));

            eventSource.onmessage = function(event) {
                if (event.data === "[PROCESS_COMPLETE]") {
                    eventSource.close();
                    outputDiv.innerHTML += "\n✅ Connection Closed.";
                    runBtn.disabled = false; // Unlock the button
                } else {
                    outputDiv.innerHTML += event.data + "\n";
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                }
            };

            eventSource.onerror = function() {
                outputDiv.innerHTML += "\n❌ Connection lost.";
                eventSource.close();
                runBtn.disabled = false;
            };
        }
    </script>
</body>
</html>
