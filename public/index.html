<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Organizer Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #ffffff; padding: 40px; max-width: 800px; margin: auto; }
        h1 { color: #bb86fc; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .controls { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        select, input { padding: 12px; font-size: 16px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; flex-grow: 1; min-width: 200px; }
        select:disabled { background: #222; color: #666; cursor: not-allowed; }
        input { font-weight: bold; color: #bb86fc; width: 100%; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
        button { padding: 12px 24px; font-size: 16px; color: #000; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; flex: 1; }
        button:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; }
        .btn-run { background: #03dac6; }
        .btn-run:hover { background: #00b3a6; }
        .btn-missing { background: #ff9800; }
        .btn-missing:hover { background: #e68a00; }

        #console-output { background: #000000; color: #00ff00; padding: 20px; margin-top: 25px; height: 400px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; border-radius: 6px; border: 1px solid #333; }
        .help-text { font-size: 14px; color: #aaa; width: 100%; margin-top: 5px; margin-bottom: 10px; }
        .row { display: flex; gap: 10px; width: 100%; }
    </style>
</head>
<body>

    <h1>🎬 Anime Organizer</h1>
    <p>Select your show, verify the name, and organize!</p>
    
    <div class="controls">
        <div class="row">
            <select id="main-folder-select" onchange="updateSubfolders()">
                <option value="">Loading library...</option>
            </select>
            
            <select id="sub-folder-select" disabled>
                <option value="">(No subfolders)</option>
            </select>
        </div>

        <div class="row" style="flex-direction: column;">
            <input type="text" id="search-input" placeholder="Official MyAnimeList Name or ID" />
            <div class="help-text">↑ Edit this box to fix Japanese names (e.g., Niwatori Fighter) or paste the exact MyAnimeList ID!</div>
        </div>
    </div>

    <div class="btn-group">
        <button id="run-btn" class="btn-run" onclick="startProcess('/api/run-script')">✏️ Run Renamer</button>
        <button id="missing-btn" class="btn-missing" onclick="startProcess('/api/missing-episodes')">🔍 Find Missing Episodes</button>
    </div>

    <div id="console-output">Ready...</div>

    <script>
        let libraryData = {}; 

        window.onload = async function() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch('/api/folders?nocache=' + timestamp);
                
                libraryData = await response.json();
                const mainSelect = document.getElementById('main-folder-select');
                const shows = Object.keys(libraryData);
                
                if (shows.length === 0) {
                    mainSelect.innerHTML = '<option value="">No folders found in D:/Anime</option>';
                    return;
                }

                mainSelect.innerHTML = '<option value="">-- Select a Show --</option>';
                shows.forEach(show => { mainSelect.appendChild(new Option(show, show)); });
            } catch (error) {
                document.getElementById('console-output').innerHTML = "❌ Failed to load library folders.";
            }
        };

        function updateSubfolders() {
            const mainSelect = document.getElementById('main-folder-select');
            const subSelect = document.getElementById('sub-folder-select');
            const searchInput = document.getElementById('search-input');
            const selectedShow = mainSelect.value;

            // Auto-fill the text box!
            searchInput.value = selectedShow;

            subSelect.innerHTML = ''; 

            if (!selectedShow || !libraryData[selectedShow] || libraryData[selectedShow].length === 0) {
                subSelect.innerHTML = '<option value="">(No subfolders)</option>';
                subSelect.disabled = true;
                return;
            }

            subSelect.disabled = false;
            subSelect.innerHTML = '<option value="">-- Main Folder --</option>'; 
            libraryData[selectedShow].forEach(sub => { subSelect.appendChild(new Option(sub, sub)); });
        }

function startProcess(apiEndpoint) {
            const show = document.getElementById('main-folder-select').value;
            const sub = document.getElementById('sub-folder-select').value;
            const searchName = document.getElementById('search-input').value.trim();
            const outputDiv = document.getElementById('console-output');
            const runBtn = document.getElementById('run-btn');
            const missingBtn = document.getElementById('missing-btn');

            // THE FIX: Removed the lock! Now it only cares if you selected a folder.
            if (!show) {
                alert("Please select a show first!");
                return;
            }

            const targetFolder = sub ? `${show}/${sub}` : show;

            runBtn.disabled = true;
            missingBtn.disabled = true;
            
            // Gives you a cleaner printout if you leave the box empty
            let displaySearch = searchName ? `"${searchName}"` : "Auto-detecting from folder name...";
            outputDiv.innerHTML = `Initializing script for: ${targetFolder}...\nSearching for: ${displaySearch}\n=============================================\n`;

            const eventSource = new EventSource(`${apiEndpoint}?folder=${encodeURIComponent(targetFolder)}&searchName=${encodeURIComponent(searchName)}`);

            eventSource.onmessage = function(event) {
                if (event.data === "[PROCESS_COMPLETE]") {
                    eventSource.close();
                    outputDiv.innerHTML += "\n✅ Connection Closed.";
                    runBtn.disabled = false; 
                    missingBtn.disabled = false;
                } else {
                    outputDiv.innerHTML += event.data + "\n";
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                }
            };

            eventSource.onerror = function() {
                outputDiv.innerHTML += "\n❌ Connection lost.";
                eventSource.close();
                runBtn.disabled = false;
                missingBtn.disabled = false;
            };
        }
    </script>
</body>
</html>
